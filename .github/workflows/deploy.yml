name: Déployer la documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true    # annule le build précédent si un nouveau push arrive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # nécessaire pour git-revision-date si ajouté plus tard

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"   # dernière 3.x stable, patches de sécurité inclus
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Construire le site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
