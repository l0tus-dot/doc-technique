site_name: Documentation technique
site_description: Procédures réseau, systèmes et cybersécurité — BTS SIO SISR
site_author: Raphaël Coantin
site_url: https://l0tus-dot.github.io/doc-technique/

copyright: Raphaël Coantin — BTS SIO SISR

hooks:
  - hooks/recent_pages.py

theme:
  name: material
  custom_dir: overrides
  language: fr
  favicon: assets/favicon.svg
  icon:
    logo: material/router-network
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Passer en clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Passer en sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-icons.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      toc_depth: 3
      title: Sur cette page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: [fr, en]
  - tags
  - i18n:
      languages:
        - locale: fr
          name: Français
          default: true
        - locale: en
          name: English
          nav_translations:
            Accueil: Home
            Conventions: Conventions
            Gabarit: Template
            Tags: Tags
            Réseau: Network
            Routage statique: Static routing
            Routage dynamique — RIP version 2: Dynamic routing — RIP v2
            NAT et PAT: NAT and PAT
            DHCP: DHCP
            Conteneurisation: Containerization
            Docker: Docker
            Dépannage réseau: Network troubleshooting
            Cybersécurité: Cybersecurity
            Segmentation VLSM: VLSM Subnetting
            Listes de contrôle d'accès (ACL Cisco): Access Control Lists (Cisco ACL)
            Délégation de droits avec sudo: Privilege delegation with sudo
            VPN (WireGuard): VPN (WireGuard)
            Active Directory: Active Directory
            Mémos: Cheat sheets
            Mémo Cisco IOS: Cisco IOS cheat sheet
            Mémo Netplan: Netplan cheat sheet
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      type: date
      locale: fr
      custom_format: "%d %B %Y"

nav:
  - Accueil:
      - index.md
      - conventions.md
      - gabarit.md
      - tags.md
  - Réseau:
      - reseau/index.md
      - reseau/routage-statique.md
      - reseau/rip-v2.md
      - reseau/nat-pat.md
      - reseau/dhcp.md
      - reseau/active-directory.md
      - depannage/index.md
  - Conteneurisation:
      - conteneurisation/docker.md
  - Cybersécurité:
      - securite/index.md
      - securite/vlsm.md
      - securite/cisco-acl.md
      - securite/sudo-delegation.md
      - securite/vpn-wireguard.md
  - Mémos:
      - memos/cisco-ios.md
      - memos/netplan.md
