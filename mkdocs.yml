site_name: Documentation technique
site_description: Procédures réseau, systèmes et cybersécurité — BTS SIO SISR
site_author: Raphaël Coantin
site_url: https://docs.votredomaine.fr/

copyright: Raphaël Coantin — BTS SIO SISR

theme:
  name: material
  language: fr
  favicon: assets/favicon.svg
  icon:
    logo: material/router-network
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Passer en clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Passer en sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      toc_depth: 2
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - i18n:
      languages:
        - locale: fr
          name: Français
          default: true
        - locale: en
          name: English
          nav_translations:
            Accueil: Home
            Projets transverses: Cross-cutting projects
            Réseau: Network
            Conteneurisation / DevOps: Containerization / DevOps
            Dépannage réseau: Network troubleshooting
            Systèmes: Systems
            Cybersécurité: Cybersecurity
            Services: Services
            Mémos: Cheat sheets

nav:
  - Accueil:
      - index.md
      - conventions.md
      - gabarit.md
  - Projets transverses:
      - projets-transverses/index.md
  - Réseau:
      - reseau/index.md
      - reseau/routage-statique.md
      - reseau/rip-v2.md
      - reseau/nat-pat.md
  - Conteneurisation / DevOps:
      - conteneurisation/index.md
      - conteneurisation/docker.md
  - Dépannage réseau:
      - depannage/index.md
  - Systèmes:
      - systemes/index.md
  - Cybersécurité:
      - securite/index.md
      - securite/sudo-delegation.md
  - Services:
      - services/index.md
  - Mémos:
      - memos/cisco-ios.md
      - memos/netplan.md
