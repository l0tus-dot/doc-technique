{% extends "base.html" %}

{% block content %}
  {# Affiche le bouton sur toutes les pages sauf la page d'accueil #}
  {% if not page.is_homepage %}
  <div class="print-action-bar">
    <button class="print-btn" onclick="window.print()" title="Télécharger en PDF">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
      </svg>
      Télécharger en PDF
    </button>
  </div>
  {% endif %}
  {{ super() }}
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    {# La recherche intégrée élargit chaque mot d'une requête à plusieurs
       termes (ex: « no shutdown » devient « no* shutdown* »), ce qui noie
       un mot distinctif derrière un mot courant. Pas de correctif fiable
       sans réécrire la logique de requête du moteur ; on indique plutôt
       la bonne pratique dans le placeholder. #}
    document.addEventListener("DOMContentLoaded", function () {
      var hint = document.documentElement.lang === "en"
        ? "Search one precise word (e.g. shutdown)"
        : "Chercher un mot précis (ex: shutdown)";
      document.querySelectorAll(".md-search__input").forEach(function (el) {
        el.setAttribute("placeholder", hint);
      });
    });
  </script>
{% endblock %}
